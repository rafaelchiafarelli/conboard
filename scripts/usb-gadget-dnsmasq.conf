# DHCP (only) for the conboard USB-ethernet gadget's usb0 link. Scoped so it can
# never reach any other interface -- this box's WiFi/ethernet uplink must never
# get leases handed out on it by accident. Only started at all when
# usb-composite-all.sh's endpoint-budget probe found room for the network
# function (see /run/conboard/usb-gadget-network, checked by
# usb-gadget-dhcp.service's ConditionPathExists) -- some boards can't fit ECM
# alongside HID+mass-storage, see NOTES.md "Ethernet-gadget access".
#
# bind-dynamic (not bind-interfaces): usb0 is created by usb-composite-all.sh
# before this service starts, but its carrier state flaps with host
# plug/unplug -- bind-dynamic tolerates that without dnsmasq refusing to start
# or crashing if the interface is momentarily down.
interface=usb0
bind-dynamic
except-interface=lo

# DHCP only -- no DNS proxy (nothing here needs one, and it's one less thing
# listening on the network).
port=0

# One /24, board is 10.55.0.1 (set by usb-composite-all.sh). Small pool: at
# most one host is ever plugged into usb0 at a time.
dhcp-range=10.55.0.10,10.55.0.100,255.255.255.0,12h

# Don't advertise this board as a default gateway -- it doesn't route traffic
# anywhere, it's just a console endpoint on this one link.
dhcp-option=3

# Keep leases out of /var/lib on the base image; conboard owns this file.
dhcp-leasefile=/conboard/disk/usb-gadget-dnsmasq.leases
