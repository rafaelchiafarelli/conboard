syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/device_type_5a67e5f27cce34a1ec5ac267a70f5d87.proto";

message device_type_Message {
    device_type msg = 1;
}
//message for the standard functions 
message device_type_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message device_type_ID {
    int32 id = 1;
}
message device_type_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service device_type_Service {
    rpc heartBeat(device_type_HeartBeat) returns (device_type_HeartBeat) {}
    rpc streamSrc(device_type_Stream ) returns (stream device_type_Message) {}
    rpc pullByID(device_type_ID) returns (device_type_Message) {}
    rpc push(device_type_Message) returns (errorCode) {}
}
