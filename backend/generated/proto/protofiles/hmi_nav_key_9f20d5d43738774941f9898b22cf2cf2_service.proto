syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/hmi_nav_key_9f20d5d43738774941f9898b22cf2cf2.proto";

message hmi_nav_key_Message {
    hmi_nav_key msg = 1;
}
//message for the standard functions 
message hmi_nav_key_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message hmi_nav_key_ID {
    int32 id = 1;
}
message hmi_nav_key_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service hmi_nav_key_Service {
    rpc heartBeat(hmi_nav_key_HeartBeat) returns (hmi_nav_key_HeartBeat) {}
    rpc streamSrc(hmi_nav_key_Stream ) returns (stream hmi_nav_key_Message) {}
    rpc pullByID(hmi_nav_key_ID) returns (hmi_nav_key_Message) {}
    rpc push(hmi_nav_key_Message) returns (errorCode) {}
}
