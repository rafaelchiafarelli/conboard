syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/output_action_7fb7af9d1e69abe2d7a6e81c4a2d0c2f.proto";

message output_action_Message {
    output_action msg = 1;
}
//message for the standard functions 
message output_action_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message output_action_ID {
    int32 id = 1;
}
message output_action_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service output_action_Service {
    rpc heartBeat(output_action_HeartBeat) returns (output_action_HeartBeat) {}
    rpc streamSrc(output_action_Stream ) returns (stream output_action_Message) {}
    rpc pullByID(output_action_ID) returns (output_action_Message) {}
    rpc push(output_action_Message) returns (errorCode) {}
}
