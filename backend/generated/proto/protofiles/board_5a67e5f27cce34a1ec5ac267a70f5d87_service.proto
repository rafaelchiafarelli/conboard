syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/board_5a67e5f27cce34a1ec5ac267a70f5d87.proto";

message board_Message {
    board msg = 1;
}
//message for the standard functions 
message board_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message board_ID {
    int32 id = 1;
}
message board_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service board_Service {
    rpc heartBeat(board_HeartBeat) returns (board_HeartBeat) {}
    rpc streamSrc(board_Stream ) returns (stream board_Message) {}
    rpc pullByID(board_ID) returns (board_Message) {}
    rpc push(board_Message) returns (errorCode) {}
}
