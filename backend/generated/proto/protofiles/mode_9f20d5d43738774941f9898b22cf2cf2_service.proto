syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/mode_9f20d5d43738774941f9898b22cf2cf2.proto";

message mode_Message {
    mode msg = 1;
}
//message for the standard functions 
message mode_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message mode_ID {
    int32 id = 1;
}
message mode_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service mode_Service {
    rpc heartBeat(mode_HeartBeat) returns (mode_HeartBeat) {}
    rpc streamSrc(mode_Stream ) returns (stream mode_Message) {}
    rpc pullByID(mode_ID) returns (mode_Message) {}
    rpc push(mode_Message) returns (errorCode) {}
}
