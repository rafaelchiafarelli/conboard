syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/trigger_kind_b13f689a5b6f99919ddaf4d1cc7eb7ac.proto";

message trigger_kind_Message {
    trigger_kind msg = 1;
}
//message for the standard functions 
message trigger_kind_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message trigger_kind_ID {
    int32 id = 1;
}
message trigger_kind_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service trigger_kind_Service {
    rpc heartBeat(trigger_kind_HeartBeat) returns (trigger_kind_HeartBeat) {}
    rpc streamSrc(trigger_kind_Stream ) returns (stream trigger_kind_Message) {}
    rpc pullByID(trigger_kind_ID) returns (trigger_kind_Message) {}
    rpc push(trigger_kind_Message) returns (errorCode) {}
}
