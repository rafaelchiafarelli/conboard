syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/trigger_edge_1bf812ac18b80d4a5ea4d51e6bfb7f58.proto";

message trigger_edge_Message {
    trigger_edge msg = 1;
}
//message for the standard functions 
message trigger_edge_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message trigger_edge_ID {
    int32 id = 1;
}
message trigger_edge_Stream {
    int32 id = 1;
    string name = 2;
}
service trigger_edge_Service {
    rpc heartBeat(trigger_edge_HeartBeat) returns (trigger_edge_HeartBeat) {}
    rpc streamSrc(trigger_edge_Stream ) returns (stream trigger_edge_Message) {}
    rpc pullByID(trigger_edge_ID) returns (trigger_edge_Message) {}
    rpc push(trigger_edge_Message) returns (errorCode) {}
}
