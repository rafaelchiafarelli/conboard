syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/hmi_control_7fb7af9d1e69abe2d7a6e81c4a2d0c2f.proto";

message hmi_control_Message {
    hmi_control msg = 1;
}
//message for the standard functions 
message hmi_control_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message hmi_control_ID {
    int32 id = 1;
}
message hmi_control_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service hmi_control_Service {
    rpc heartBeat(hmi_control_HeartBeat) returns (hmi_control_HeartBeat) {}
    rpc streamSrc(hmi_control_Stream ) returns (stream hmi_control_Message) {}
    rpc pullByID(hmi_control_ID) returns (hmi_control_Message) {}
    rpc push(hmi_control_Message) returns (errorCode) {}
}
