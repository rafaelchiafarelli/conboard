syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/mode_69421342752d53d5f274b99a6a0c123e.proto";

message mode_Message {
    mode msg = 1;
}
//message for the standard functions 
message mode_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message mode_ID {
    int32 id = 1;
}
message mode_Stream {
    int32 id = 1;
    string name = 2;
}
service mode_Service {
    rpc heartBeat(mode_HeartBeat) returns (mode_HeartBeat) {}
    rpc streamSrc(mode_Stream ) returns (stream mode_Message) {}
    rpc pullByID(mode_ID) returns (mode_Message) {}
    rpc push(mode_Message) returns (errorCode) {}
}
