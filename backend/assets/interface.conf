# conboard device web front — nginx.
#
# Serves the built console SPA (Vite bundle installed at /conboard/frontend) and
# reverse-proxies the backend REST + websockets. install-on-device.sh drops this at
# /etc/nginx/conf.d/conboard.conf and reloads nginx.
#
#   /            -> static SPA; client-side routing falls back to index.html
#   /api/v1/     -> backend Crow REST   (127.0.0.1:8080, already served under /api/v1)
#   /healthz     -> backend health check
#   /ws          -> backend dispatcher-relay websocket (127.0.0.1:8080)
#   /websocket   -> dispatcher live user-action stream (127.0.0.1:40080; INTERFACE.md O1)

client_max_body_size 800M;

# Pass through the WebSocket upgrade only when the client asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The built console bundle (console/dist) is installed here by the artifact.
    root /conboard/frontend;
    index index.html;

    # --- backend REST API (path preserved: backend serves under /api/v1) --------
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
    }

    # --- websockets (need HTTP/1.1 + Upgrade) ----------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /websocket {
        # dispatcher's WS route is /ws (INTERFACE.md §3); map the public /websocket onto it.
        proxy_pass http://127.0.0.1:40080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # --- SPA: serve static assets, fall back to index.html for client routes ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
