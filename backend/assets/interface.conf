# conboard device web front — nginx.
#
# Serves the built console SPA (Vite bundle installed at /conboard/frontend) and
# reverse-proxies the backend REST + websockets. install-on-device.sh drops this at
# /etc/nginx/conf.d/conboard.conf and reloads nginx.
#
#   /            -> static SPA; client-side routing falls back to index.html
#   /api/v1/     -> backend Crow REST   (127.0.0.1:8080, already served under /api/v1)
#   /healthz     -> backend health check
#   /websocket   -> dispatcher live user-action stream (127.0.0.1:40080; INTERFACE.md O1)
#
# --- perimeter auth (nginx Basic Auth, in front of everything but /healthz) -----
# The app-level X-User/X-Pswd gate the backend itself checks (see backend/README.md)
# is a fixed value baked into harpia-generated code, effectively public (it's a
# schema-content hash, not a real secret). This Basic Auth layer is the actual
# per-install secret: install-on-device.sh generates a random password into
# /etc/nginx/.htpasswd-conboard on first install (kept across reinstalls, removed
# only by `uninstall-on-device.sh --purge`). Browsers cache the credential for the
# origin after the first prompt, so the SPA's own fetch/WS calls need no changes.

client_max_body_size 800M;

# Pass through the WebSocket upgrade only when the client asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The built console bundle (console/dist) is installed here by the artifact.
    root /conboard/frontend;
    index index.html;

    # Perimeter auth for everything below except the health check (monitoring
    # shouldn't need a credential). auth_basic_user_file is written by
    # install-on-device.sh BEFORE this conf is installed -- `nginx -t` refuses to
    # start if the file is missing, so a missing password file blocks the site
    # from ever serving unauthenticated rather than silently allowing it through.
    auth_basic "conboard";
    auth_basic_user_file /etc/nginx/.htpasswd-conboard;

    # --- backend REST API (path preserved: backend serves under /api/v1) --------
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080/healthz;
    }

    # --- websocket (needs HTTP/1.1 + Upgrade) -----------------------------------
    # The backend itself has no websocket route -- the realtime stream is proxied
    # straight from the dispatcher, never through the backend process.
    location /websocket {
        # dispatcher's WS route is /ws (INTERFACE.md §3); map the public /websocket onto it.
        proxy_pass http://127.0.0.1:40080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # --- SPA: serve static assets, fall back to index.html for client routes ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
