# conboard backend — local PostgreSQL for development (2026-06-30).
# Brings up Postgres only; the C++ backend is run/debugged on the host against it.
#   docker compose up -d        # start
#   docker compose down         # stop (keeps the named volume)
#   docker compose down -v      # stop + wipe the DB
services:
  postgres:
    image: postgres:16-alpine
    container_name: conboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conboard}
      POSTGRES_DB: ${POSTGRES_DB:-conboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - conboard_pgdata:/var/lib/postgresql/data
      # Ordered bootstrap/migration SQL is applied on first init of an empty volume:
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conboard} -d ${POSTGRES_DB:-conboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  conboard_pgdata:
